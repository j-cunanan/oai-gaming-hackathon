input:
  title: '[Evidence guided] Persistent Datapatch bug'
  body: '### Platforms


    Android


    ### Build


    BE 27790


    ### Issue


    When you save a datapatch in a map, suddenly, attempting to remove it does not work.

    When you remove it, it gets temporarily removed, but gets added back when you open the map.

    I tested this with or without mods and it still happened by the way.


    ### Steps to reproduce


    Make map

    Add data-patch

    Save map

    Delete data-patch

    Save map

    Leave editor

    Come back to map editor

    See that the data-patch is back.


    ### Mods used


    I tested it in vanilla but here are the mods I usually use.


    Auto Research (gone from in-game mod browser?)

    Patch Editor (I think this mod doesn''t cause the issue)

    Patch Viewer

    CLaJ


    ### Save file


    I zipped the msav here


    [persistent datapatch bug.zip](https://github.com/user-attachments/files/32028828/persistent.datapatch.bug.zip)


    ### (Crash) logs


    _No response_


    ### REPRO recording guidance (not part of the upstream report)


    A previous local attempt reached the reported sequence, but the final oracle omitted its recorded initial-save
    screenshot. Two of five independent replay judgments were inconclusive because that prerequisite was not
    visible in the selected evidence. This is a fresh attempt; those prior judgments do not establish the current
    result.


    Capture and select the important checkpoints in chronological order: the map identity and existing patch,
    visible successful initial save, confirmed deletion with an empty list, visible successful save after deletion,
    exit/reopen of the same map, and the patch list after reopening. Include both successful-save screenshots
    in the final sequence oracle, within its eight-checkpoint limit. Use neutral labels for the resulting state;
    inspect what is actually visible rather than assuming disappearance or reappearance. If prerequisites cannot
    be demonstrated, report that limitation.

    '
