    \ to them in game. I tested this on both v159.7 and BE 27795 just to make sure\
    \ it was not yet addressed.\n\nIn the save file below I did it for the following\
    \ values: ff0000 to ff2000. Here is the table for the hex codes inputted vs accepted\
    \ by the editor so you can copy paste: \nff0000 -> ff0000\nff0100 -> ff0100\n\
    ff0200 -> ff0200\nff0300 -> ff0200\nff0400 -> ff0300\nff0500 -> ff0500 \nff0600\
    \ -> ff0600\nff0700 -> ff0700\nff0800 -> ff0700\nff0900 -> ff0800\nff0a00 -> ff0a00\n\
    ff0b00 -> ff0b00\nff0c00 -> ff0b00\nff0d00 -> ff0c00\nff0e00 -> ff0e00\nff0f00\
    \ -> ff0f00\nff1000 -> ff1000\nff1100 -> ff1000\nff1200 -> ff1100\nff1300 -> ff1300\n\
    ff1400 -> ff1400\nff1500 -> ff1400\nff1600 -> ff1500\nff1700 -> ff1600\nff1800\
    \ -> ff1800\nff1900 -> ff1900\nff1a00 -> ff1900\nff1b00 -> ff1a00\nff1c00 -> ff1c00\n\
    ff1d00 -> ff1d00\nff1e00 -> ff1e00\nff1f00 -> ff1e00\nff2000 -> ff1f00\n\n###\
    \ Steps to reproduce\n\n1. Open the map editor and go to edit any map\n2. Select\
    \ the 'Colored Floor' or 'Colored Wall' tile in editor \n3. Paste in any hex color\
    \ codes that differ by 1 in value and place each one down next to one another,\
