  title: "Visual bug: Arrow from \"jump\" instruction is offset with the \"always\" configuration."
  body: "### Platforms\n\nAndroid\n\n### Build\n\nRelease Build 159.7\n\n### Issue\n\nIn a processor, the \"always\" configuration of the \"jump\" instruction offsets the origin point of the visual arrow, leading to spaghetti and unreadable jumps.\n\nArrow normal:\n<img width=\"686\" height=\"693\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/7d469cf3-a7fc-4104-830c-b5123cf4cf5e\" />\nArrow offset:\n<img width=\"719\" height=\"760\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/47b2af09-e771-4624-8a96-e768726abbeb\" />\n\n### Steps to reproduce\n\nIn any processor, use the \"always\" configuration of the \"jump' instruction. The arrow will be offset like is the example images.\n\n### Mods used\n\nnone\n\n### Save file\n\n[Fortress Sep 05 6_19.zip](https://github.com/user-attachments/files/31867447/Fortress.Sep.05.6_19.zip)\n\n### (Crash) logs\n\n_No response_"
