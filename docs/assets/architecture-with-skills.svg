<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">REPRO architecture</title>
<desc id="desc">The React dashboard connects through FastAPI to the workflow manager. The Python CLI also uses the manager. The manager connects to SQLite, evidence storage, the Responses API controller, and verification and replay. The controller operates restricted function tools against a disposable Docker game desktop. Verification uses the controller and desktop. Desktop evidence flows to the artifact store. Each game and investigation stage can have skills: reusable procedures selected by the workflow manager to guide the model controller.</desc>
