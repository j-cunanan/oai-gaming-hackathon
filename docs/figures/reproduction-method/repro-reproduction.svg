<text x="543" y="453.8" font-size="15" font-weight="400" fill="#B4AFC1" text-anchor="middle">screenshots</text>
<text x="340" y="499.32" font-size="21" font-weight="700" fill="#F4F1FC" text-anchor="start">Hypothesize</text>
<text x="340" y="530.48" font-size="19" font-weight="400" fill="#B4AFC1" text-anchor="start">Choose next input</text>
<text x="592" y="498.4" font-size="20" font-weight="700" fill="#F4F1FC" text-anchor="start">Linux desktop</text>
<text x="592" y="529.56" font-size="18" font-weight="400" fill="#B4AFC1" text-anchor="start">Isolated in Docker</text>
