<text x="836" y="302.92" font-size="26" font-weight="700" fill="#F4F1FC" text-anchor="start">Replay from a clean state</text>
<text x="836" y="358.24" font-size="22" font-weight="400" fill="#F4F1FC" text-anchor="start">5 fresh profiles by default</text>
