<text x="1292" y="358.24" font-size="22" font-weight="700" fill="#F4F1FC" text-anchor="start">Reduce, then reconfirm</text>
<text x="1292" y="390.56" font-size="18" font-weight="400" fill="#B4AFC1" text-anchor="start">Preserve required checkpoints.</text>
