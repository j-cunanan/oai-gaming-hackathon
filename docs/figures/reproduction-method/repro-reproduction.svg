<text x="836" y="544.16" font-size="23" font-weight="700" fill="#F4F1FC" text-anchor="start">Judge each run's checkpoints</text>
<text x="836" y="582.32" font-size="21" font-weight="400" fill="#B4AFC1" text-anchor="start">Original symptom + 2–8 images</text>
<text x="836" y="618.32" font-size="21" font-weight="700" fill="#9DE0BF" text-anchor="start">Separate verification call</text>
<text x="836" y="647.64" font-size="17" font-weight="400" fill="#B4AFC1" text-anchor="start">Incomplete evidence stays inconclusive.</text>
