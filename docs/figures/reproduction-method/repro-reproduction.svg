<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">How REPRO makes a bug repeatable</title><desc id="desc">A player report defines the symptom and game revision. An AI investigator experiments in an isolated game while recording inputs and evidence. A fixed replay runs on five fresh profiles by default. A separate model call verifies the original symptom using ordered checkpoint images. Action reduction preserves those checkpoints and reconfirms any shorter trace. The resulting YAML replay becomes a regression for a candidate patch. The Mindustry data-patch example requires visible saves, deletion and reopening of the same map.</desc><rect width="1600" height="900" fill="#111116"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="56" y="59" font-size="25" font-weight="700" fill="#CBB8FF" text-anchor="start">REPRO</text>
<text x="56" y="134" font-size="50" font-weight="700" fill="#F4F1FC" text-anchor="start">How REPRO makes a bug repeatable</text>
<text x="56" y="180.08" font-size="24" font-weight="400" fill="#B4AFC1" text-anchor="start">AI discovers the trigger. A frozen replay must reproduce it on fresh game profiles.</text>
<rect x="318" y="228" width="444" height="430" rx="10" fill="#1C1827" stroke="#786497" stroke-width="1.5"/>
<rect x="810" y="228" width="424" height="430" rx="10" fill="#17231D" stroke="#527F6A" stroke-width="1.5"/>
<text x="56" y="260.56" font-size="18" font-weight="700" fill="#90899E" text-anchor="start">01  DEFINE</text>
<text x="56" y="304.76" font-size="28" font-weight="700" fill="#F4F1FC" text-anchor="start">Player report</text>
<text x="56" y="365.16" font-size="23" font-weight="400" fill="#CBB8FF" text-anchor="start">“The deleted patch</text>
<text x="56" y="393.68" font-size="23" font-weight="400" fill="#CBB8FF" text-anchor="start">comes back after</text>
<text x="56" y="422.20000000000005" font-size="23" font-weight="400" fill="#CBB8FF" text-anchor="start">I reopen my map.”</text>
<text x="56" y="493.32" font-size="21" font-weight="400" fill="#B4AFC1" text-anchor="start">Pin the game revision</text>
<text x="56" y="519.36" font-size="21" font-weight="400" fill="#B4AFC1" text-anchor="start">and expected behavior.</text>
<text x="56" y="582.32" font-size="21" font-weight="400" fill="#B4AFC1" text-anchor="start">The report defines</text>
<text x="56" y="608.36" font-size="21" font-weight="400" fill="#B4AFC1" text-anchor="start">what counts as the bug.</text>
