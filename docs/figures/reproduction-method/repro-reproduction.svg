<text x="344" y="621.4" font-size="20" font-weight="400" fill="#B4AFC1" text-anchor="start">Check the first attempt before replay.</text>
<text x="788" y="372.72" font-size="16" font-weight="700" fill="#CBB8FF" text-anchor="middle">Freeze</text>
<text x="788" y="392.56" font-size="16" font-weight="700" fill="#CBB8FF" text-anchor="middle">trace</text>
