[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repro-bugops"
version = "0.1.0"
description = "Evidence-driven bug investigation for open-source games"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "openai>=2.0,<3", "typer>=0.15,<1", "httpx>=0.28,<1",
  "pyyaml>=6,<7", "python-multipart>=0.0.20,<1",
]

[project.scripts]
repro = "repro.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["repro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
